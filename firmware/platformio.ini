; SmartRele firmware · rele-esp12f
; Board: ESP-12F (ESP8266EX, 4 MB SPI flash)

[platformio]
default_envs = esp12f

[env]
platform = espressif8266@^4.2.1
framework = arduino
board = esp12e                      ; ESP-12E and ESP-12F share pinout and 4 MB flash
board_build.flash_mode = dout       ; the mode that works with any module flash chip
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld   ; 1 MB LittleFS and ~1 MB per OTA image
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
upload_speed = 460800
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -D FW_VERSION=\"1.0.0\"
    -Wall

; Flashing through header J3 (3.3 V USB-serial adapter, board powered at 5 V through J3)
[env:esp12f]

; Network update with ArduinoOTA:
;   pio run -e esp12f_ota -t upload --upload-port <IP or name.local>
; The password is the admin password set in the web interface (env. variable SMARTRELE_PASS).
[env:esp12f_ota]
upload_protocol = espota
upload_flags =
    --auth=${sysenv.SMARTRELE_PASS}
